<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Music Visualizer</title>
    <link rel="icon" type="image/x-icon" href="/visualizer/images/icons8-musical-32.png">
</head>
<body>
    <div class="playback">
        <input type="file" accept="audio/*" id="audio-file">
        <img src="images/icons8-musical-note-64.png" id="upload-btn">
        <div class="player">
            <button id="play-btn">▶</button>
            <span id="current-time">0:00</span>
            <input type="range" id="progress" value="0" min="0" max="100">
            <span id="duration">0:00</span>
            <input type="range" id="volume" value="1" min="0" max="1" step="0.1">
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
    <script src="sketch.js"></script>
</body>
</html>
