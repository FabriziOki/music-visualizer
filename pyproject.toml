[project]
name = "music-mood-visualizer"
version = "0.1.0"
requires-python = ">=3.10"

# --- Person B: Audio Engine ---
dependencies = [
    "librosa>=0.10",
    "numpy>=1.26",
    "sounddevice>=0.4",
    "soundfile>=0.12",


# --- Person C: Classifier + API (add here) ---
 "fastapi>=0.111",
 "uvicorn[standard]>=0.29",
 "python-multipart>=0.0.9",
]
# "scikit-learn>=1.4",

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["audio*", "classifier*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
